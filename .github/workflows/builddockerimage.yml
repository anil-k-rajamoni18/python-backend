name: Lint, Build & Deploy Docker Image

on:
  push:
    branches: [ "feature/githubactions" ]
  pull_request:
    branches: [ "feature/githubactions" ]

jobs:
  lint-build-deploy:
    runs-on: ubuntu-latest

    # All `run:` commands will start in this folder
    # 👉 CHANGE THIS to your actual folder
    defaults:
      run:
        working-directory: Python/Day10/fastapi-docker-example

    steps:
      # 1) Checkout repo (clone equivalent)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3) Install dependencies for linting
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      # 4) Lint Python code
      - name: Run flake8 linting
        run: |
          flake8 .

      # 5) Log in to Docker Hub
      #    👉 You must create secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6) Build & push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # Context is the folder with Dockerfile
          # This is relative to repo root, NOT to working-directory above
          context: ./Python/Day10/fastapi-docker-example
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-docker-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-docker-app:${{ github.sha }}
