name: Lint, Build & Deploy Docker Image

on:
  push:
    branches: [ "feature/githubactions" ]
  pull_request:
    branches: [ "feature/githubactions" ]

jobs:
  lint-build-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Python/Day10/fastapi-docker-example

    steps:
      # 1) Checkout repo (clone equivalent)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3) Install dependencies for linting & tests
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      # 4) Lint Python code
      - name: Run flake8 linting
        run: |
          flake8 .

      # 5) Run test cases
      - name: Run pytest tests
        run: |
          pytest -q

      # 6) Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7) Build & push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Python/Day10/fastapi-docker-example
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-docker-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-docker-app:${{ github.sha }}

