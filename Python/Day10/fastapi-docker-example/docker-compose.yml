version: '3.9'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    networks:
      - app-network
    environment:
      - DB_HOST=mysql-db
    depends_on:
      - mysql-db

  mysql-db:
    image: mysql:8.2
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysqldata:
